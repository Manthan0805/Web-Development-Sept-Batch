<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            background-color: aqua;
            width: 300px;
            border-style: solid;
            border-width: 3px;
            border-radius: 10px;
            margin: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        div p{
            border-bottom: 2px double #000;
            padding-bottom: 5px;
        }
    </style>

</head>
<body>
    <div class="a">
        <p>Hello Everyone</p>
    </div>

    <div class="a">
        <p>Another Box</p>
    </div>
</body>
</html>
