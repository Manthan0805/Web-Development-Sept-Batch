<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            background-color: aqua;
            border: 1px solid black;
            width: 300px;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            box-shadow: 2px 2px 4px #000000;
            
        }
        div p{
            
            padding-bottom: 5px;
        }
        .a img{
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 150px;
            border-radius: 10px;
        }
        .a:hover{
            background-color: rgb(255, 136, 0);
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }
        .a:button{
            text-align: center;
        }
        </style>
</head>
<body>
    <div class="a">
        <img src="https://images.pexels.com/photos/210662/pexels-photo-210662.jpeg" alt="Product Image" height="200px" width="200px">
        <h2>HeadPhones</h2>
        <p>High-quality wireless headphones with noise cancellation.</p>
        <p>Price: 2099.99</p>
        <button>Add to Cart</button>
    </div>
    
    <div class="a">
        <img src="https://images.pexels.com/photos/38914242/pexels-photo-38914242.jpeg" alt="Product Image" height="200px" width="200px">
        <h2>Shoes</h2>
        <p>Comfortable and stylish shoes for everyday wear.</p>
        <p>Price: 5999.99</p>
        <button>Add to Cart</button>
    </div>
    
    <div class="a">
        <img src="https://images.pexels.com/photos/9667336/pexels-photo-9667336.jpeg" alt="Product Image">
        <h2>Tablet</h2>
        <p>Portable tablet with high-resolution display and long battery life.</p>
        <p>Price: 14999.99</p>
        <button>Add to cart</button>
    </div>
</body>
</html>
