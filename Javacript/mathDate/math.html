<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // math object

        console.log(Math.PI)
        console.log(Math.sqrt(16))
        console.log(Math.pow(2, 3))
        console.log(Math.abs(-4))
        console.log(Math.ceil(4.2)) //round to next no.
        console.log(Math.floor(4.8)) //remove decimal no.
        console.log(Math.round(4.9)) 
        console.log(Math.random()) //random no. between 0 and 1
    </script>
</body>
</html>
