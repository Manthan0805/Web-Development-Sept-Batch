<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            background-color: aqua;
        }
        p.ex1{
            display : none;
        }
        p.ex2{
            background-color: beige;
        }
    </style>
</head>
<body>
    <h1>Display : None</h1>
    <div>
        Here nothing to display
        <p class="ex1">Hello Display None</p>
    </div>
     <h1>Display : Block</h1>
    <div>
        Here display block means - block level element - 100%width of space
        <p class="ex2">Hello Display None</p>
    </div>
     <h1>Display : inline</h1>
    <div>
        Here display block means - block level element - 100%width of space
        <p class="ex3 ">Hello Display None</p>
    </div>
</body>
</html>
