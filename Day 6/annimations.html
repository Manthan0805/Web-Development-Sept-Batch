<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aquamarine;
            border-radius: 1px;
            height: 100px;
            width: 100px;
            animation-name: changecolor;
            animation-duration: 5s; 
            animation-iteration-count: infinite;
        }

       /* @keyframes changecolor{
            from {background-color: aquamarine;}

            to {background-color: beige;}
        }*/
        /*@keyframes changecolor{
            0%{background-color: red;}
            25%{background-color: grey;}
            50%{background-color: blue;}
            75%{background: maroon;}
            100%{background-color: black;}
        }*/
        @keyframes changecolors{
            0%{transform: translateX(0); background-color: red;}
            50%{transform: translateY(250); background-color: brown;}
            100%{transform: translateX(0); background-attachment: yellow;}
        }
    </style>
</head>
<body>
    <div class="box">

        <Strong>Animation effect goes back to its original form after completing</Strong>
    </div>
</body>
</html>
