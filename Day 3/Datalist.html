<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="food">Choose a food:</label>
    <input list="food">

    <datalist id="food">
        <option value="Pizza">
        <option value="Burger">
        <option value="Fries">
        <option value="Coke">            
        
    </datalist>
<label for="Countries">Choose a country:</label>
<input list="Countries">
    <datalist id="Countries">
        <option value="USA">
        <option value="Canada">
        <option value="UK">
        <option value="Australia">            
        
    </datalist>
</body>
</html>
